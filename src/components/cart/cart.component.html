<h1 class="cart-title">Savat</h1>

<div class="cart" *ngIf="cart.length; else empty">
  <div class="cart-item" *ngFor="let item of cart; let i = index">
    <div class="image-box">
      <img [src]="item.image" [alt]="item.title" />
    </div>

    <div class="info">
      <h4>{{ item.title }}</h4>
      <p class="price">${{ item.price }}</p>
    </div>

    <button class="remove-btn" (click)="remove(i)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  </div>

  <div class="cart-summary">
    <p><strong>Mahsulotlar:</strong> {{ apiService.getCartCount() }}</p>
    <p><strong>Jami summa:</strong> ${{ apiService.getCartTotal() }}</p>
  </div>
</div>

<ng-template #empty>
<div class="no-data">
  <img src="../../assets/basket.png" alt="">
  <p>Savatda mahsulot topilmadi!
  </p>
</div>
</ng-template>
